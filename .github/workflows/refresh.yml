name: Refresh dashboard data

on:
  schedule:
    # Every 30 min, ~9am-8pm IST  ->  03:00-14:30 UTC (IST = UTC+5:30)
    - cron: "0 3-15 * * *"

  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Incremental sync from TATA
        env:
          TATA_TOKEN: ${{ secrets.TATA_TOKEN }}
        run: python scripts/sync.py

      - name: Sync index.html to dashboard
        run: cp inbound-dashboard.html index.html
